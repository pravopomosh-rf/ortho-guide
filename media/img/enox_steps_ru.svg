<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 700" font-family="Rubik, Arial, sans-serif">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6D3BC"/><stop offset="1" stop-color="#EDB99B"/></linearGradient>
    <linearGradient id="fat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCE7A8"/><stop offset="1" stop-color="#F4D488"/></linearGradient>
    <g id="syr">
      <!-- шприц вертикально: игла вниз, кончик в (0,0) -->
      <line x1="0" y1="0" x2="0" y2="-46" stroke="#8C97A8" stroke-width="3" stroke-linecap="round"/>
      <rect x="-13" y="-150" width="26" height="104" rx="6" fill="#fff" stroke="#46595a" stroke-width="3"/>
      <rect x="-10" y="-112" width="20" height="63" rx="3" fill="#BFE3F7"/>
      <path d="M-24 -150h48" stroke="#46595a" stroke-width="4" stroke-linecap="round"/>
    </g>
  <clipPath id="c3"><rect x="428" y="58" width="396" height="300"/></clipPath><clipPath id="c4"><rect x="428" y="58" width="396" height="300"/></clipPath></defs>
  <rect width="840" height="700" fill="#FBF7F0"/>
  <!-- сетка панелей -->
  <g fill="#fff" stroke="#E6DED0" stroke-width="2">
    <rect x="16" y="16" width="396" height="326" rx="22"/><rect x="428" y="16" width="396" height="326" rx="22"/>
    <rect x="16" y="358" width="396" height="326" rx="22"/><rect x="428" y="358" width="396" height="326" rx="22"/>
  </g>
  <g font-weight="700" font-size="26" fill="#fff">
    <circle cx="52" cy="52" r="22" fill="#1f7a70"/><text x="52" y="61" text-anchor="middle">1</text>
    <circle cx="464" cy="52" r="22" fill="#1f7a70"/><text x="464" y="61" text-anchor="middle">2</text>
    <circle cx="52" cy="394" r="22" fill="#1f7a70"/><text x="52" y="403" text-anchor="middle">3</text>
    <circle cx="464" cy="394" r="22" fill="#1f7a70"/><text x="464" y="403" text-anchor="middle">4</text>
  </g>

  <!-- 1: место укола на животе -->
  <g>
    <path d="M110 70 C110 70 128 60 214 60 C300 60 318 70 318 70 L332 300 C332 316 320 324 300 324 L128 324 C108 324 96 316 96 300 Z" fill="url(#skin)" stroke="#D9A486" stroke-width="3"/>
    <rect x="110" y="250" width="208" height="74" fill="#9DB4D8" opacity=".55"/>
    <!-- зоны укола справа и слева от пупка, ниже/на уровне -->
    <ellipse cx="138" cy="200" rx="30" ry="42" fill="#1FA05A" opacity=".22" stroke="#1FA05A" stroke-width="3" stroke-dasharray="6 6"/>
    <ellipse cx="290" cy="200" rx="30" ry="42" fill="#1FA05A" opacity=".22" stroke="#1FA05A" stroke-width="3" stroke-dasharray="6 6"/>
    <!-- запретная зона вокруг пупка: радиус 5 см -->
    <circle cx="214" cy="180" r="40" fill="#E04848" opacity=".12" stroke="#E04848" stroke-width="3"/>
    <circle cx="214" cy="180" r="6" fill="#B5524A"/>
    <line x1="214" y1="180" x2="254" y2="180" stroke="#E04848" stroke-width="2.5"/>
    <text x="234" y="172" text-anchor="middle" font-size="17" font-weight="700" fill="#B3261E">5 см</text>
    <text x="138" y="209" text-anchor="middle" font-size="30" font-weight="800" fill="#1FA05A">✓</text>
    <text x="290" y="209" text-anchor="middle" font-size="30" font-weight="800" fill="#1FA05A">✓</text>
    <!-- чередование сторон -->
    <path d="M160 108 C190 86 238 86 268 108" fill="none" stroke="#f0a24f" stroke-width="4" stroke-linecap="round"/>
    <path d="M268 108 l-14 -2 l6 -12" fill="none" stroke="#f0a24f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M160 108 l14 -2 l-6 -12" fill="none" stroke="#f0a24f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 2: кожная складка двумя пальцами (разрез сбоку) -->
  <g>
    <path d="M444 250 L540 250 C560 250 570 170 610 170 C650 170 660 250 680 250 L808 250 L808 330 L444 330 Z" fill="url(#fat)"/>
    <path d="M444 250 L540 250 C560 250 570 170 610 170 C650 170 660 250 680 250 L808 250" fill="none" stroke="#D9A486" stroke-width="10" stroke-linejoin="round"/>
    <rect x="444" y="306" width="364" height="24" fill="#E7A2A2" opacity=".65"/>
    <!-- кисть сверху: большой и указательный пальцы собирают складку -->
    <path d="M560 60 C590 48 640 48 668 64 L676 108 C668 118 552 118 548 104 Z" fill="#F3C9AE" stroke="#C98E6E" stroke-width="3"/>
    <path d="M556 100 C540 150 540 200 556 232 C566 246 582 240 580 222 C576 190 580 150 590 112" fill="#F3C9AE" stroke="#C98E6E" stroke-width="3" stroke-linejoin="round"/>
    <path d="M668 100 C684 150 684 200 666 232 C656 246 640 240 642 222 C646 190 642 150 632 112" fill="#F3C9AE" stroke="#C98E6E" stroke-width="3" stroke-linejoin="round"/>
    <path d="M560 236 q8 4 16 0 M646 236 q8 4 16 0" stroke="#C98E6E" stroke-width="2" fill="none"/>
    <path d="M520 200 l20 0 M700 200 l-20 0" stroke="#1f7a70" stroke-width="4" stroke-linecap="round"/><path d="M528 192 l12 8 l-12 8 M692 192 l-12 8 l12 8" fill="none" stroke="#1f7a70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 3: игла под прямым углом в складку -->
  <g>
    <path d="M32 592 L128 592 C148 592 158 512 198 512 C238 512 248 592 268 592 L396 592 L396 672 L32 672 Z" fill="url(#fat)"/>
    <path d="M32 592 L128 592 C148 592 158 512 198 512 C238 512 248 592 268 592 L396 592" fill="none" stroke="#D9A486" stroke-width="10" stroke-linejoin="round"/>
    <rect x="32" y="648" width="364" height="24" fill="#E7A2A2" opacity=".65"/>
    <use href="#syr" x="198" y="560"/><g transform="translate(-412 342)" clip-path="url(#c3)"><path d="M556 100 C540 150 540 200 556 232 C566 246 582 240 580 222 C576 190 580 150 590 112" fill="#F3C9AE" stroke="#C98E6E" stroke-width="3" stroke-linejoin="round"/>
    <path d="M668 100 C684 150 684 200 666 232 C656 246 640 240 642 222 C646 190 642 150 632 112" fill="#F3C9AE" stroke="#C98E6E" stroke-width="3" stroke-linejoin="round"/></g>
    <!-- угол 90° -->
    
    <text x="290" y="508" font-size="22" font-weight="800" fill="#1f7a70" direction="ltr">90°</text>
    <path d="M92 470 v34" stroke="#1f7a70" stroke-width="4" stroke-linecap="round"/>
    <path d="M82 494 l10 12 l10 -12" fill="none" stroke="#1f7a70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 4: медленно ввести, иглу извлечь прямо -->
  <g>
    <path d="M444 592 L540 592 C560 592 570 512 610 512 C650 512 660 592 680 592 L808 592 L808 672 L444 672 Z" fill="url(#fat)"/>
    <path d="M444 592 L540 592 C560 592 570 512 610 512 C650 512 660 592 680 592 L808 592" fill="none" stroke="#D9A486" stroke-width="10" stroke-linejoin="round"/>
    <rect x="444" y="648" width="364" height="24" fill="#E7A2A2" opacity=".65"/>
    <g transform="translate(610 492) scale(.85)">
      <line x1="0" y1="0" x2="0" y2="-46" stroke="#8C97A8" stroke-width="3" stroke-linecap="round"/>
      <rect x="-13" y="-150" width="26" height="104" rx="6" fill="#fff" stroke="#46595a" stroke-width="3"/>
      <rect x="-10" y="-58" width="20" height="9" rx="3" fill="#BFE3F7"/>
      <path d="M-24 -66h48" stroke="#46595a" stroke-width="4" stroke-linecap="round"/>
    </g>
    <path d="M680 470 v-72" stroke="#1f7a70" stroke-width="4" stroke-linecap="round"/>
    <path d="M670 410 l10 -12 l10 12" fill="none" stroke="#1f7a70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="610" cy="560" r="7" fill="#E04848" opacity=".35"/><g transform="translate(0 342)" clip-path="url(#c4)"><path d="M556 100 C540 150 540 200 556 232 C566 246 582 240 580 222 C576 190 580 150 590 112" fill="#F3C9AE" stroke="#C98E6E" stroke-width="3" stroke-linejoin="round"/>
    <path d="M668 100 C684 150 684 200 666 232 C656 246 640 240 642 222 C646 190 642 150 632 112" fill="#F3C9AE" stroke="#C98E6E" stroke-width="3" stroke-linejoin="round"/></g>
  </g>
</svg>
