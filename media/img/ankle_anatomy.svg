<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-hidden="true">
<rect width="480" height="300" rx="24" fill="#fbf7f0"/>
<rect x="8" y="8" width="226" height="284" rx="18" fill="#fff" stroke="#bcd9d2" stroke-width="2"/>
<rect x="246" y="8" width="226" height="284" rx="18" fill="#fff" stroke="#f4d9b4" stroke-width="2"/>
<rect x="22" y="8" width="56" height="5" rx="2.5" fill="#1f7a70"/>
<rect x="260" y="8" width="56" height="5" rx="2.5" fill="#f0a24f"/>

<!-- ===== Panel 1: right ankle, front view (outer side on the left) ===== -->
<g stroke="#8a6a45" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
  <!-- calcaneus hint (behind/below the talus) -->
  <path d="M84 252 C 96 244, 150 244, 162 252 C 168 262, 162 276, 150 280 L 96 280 C 84 276, 78 262, 84 252 Z" fill="#f1e6d6"/>
  <!-- talus -->
  <path d="M88 204 C 92 192, 112 188, 126 188 C 142 188, 156 192, 160 202 C 164 214, 162 230, 156 242 C 148 252, 104 252, 94 242 C 86 232, 84 216, 88 204 Z" fill="#f3e3cb"/>
  <!-- fibula with lateral malleolus (reaches lower) -->
  <path d="M62 24 L76 24 C 76 70, 75 120, 77 160 C 80 176, 86 190, 86 206 C 86 224, 76 236, 66 236 C 56 236, 50 226, 50 212 C 50 196, 58 178, 60 162 C 62 120, 62 70, 62 24 Z" fill="#fbf1e1"/>
  <!-- tibia with medial malleolus -->
  <path d="M102 24 L158 24 C 158 70, 160 120, 166 150 C 170 164, 176 174, 178 190 C 180 204, 178 216, 170 220 C 162 223, 158 214, 158 204 C 158 198, 156 194, 152 192 C 138 186, 110 186, 96 192 C 92 186, 90 176, 92 164 C 96 140, 102 100, 102 24 Z" fill="#fbf1e1"/>
</g>
<!-- joint cartilage (tibia–talus) -->
<path d="M96 193 C 112 187, 138 187, 152 193" fill="none" stroke="#5fb3ab" stroke-width="4" stroke-linecap="round"/>
<!-- syndesmosis ligaments -->
<g stroke="#f0a24f" stroke-width="4" stroke-linecap="round">
  <path d="M77 150 L95 146"/><path d="M78 162 L94 159"/><path d="M80 174 L93 172"/>
</g>
<!-- malleoli outlines -->
<g fill="none" stroke="#1f7a70" stroke-width="2.5" stroke-dasharray="5 4">
  <ellipse cx="68" cy="212" rx="22" ry="27"/>
  <ellipse cx="169" cy="200" rx="15" ry="22"/>
</g>

<!-- ===== Panel 2: right ankle, outer side view (heel on the left, toes to the right) ===== -->
<g stroke="#8a6a45" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
  <!-- calcaneus -->
  <path d="M286 230 C 300 222, 330 226, 352 232 L 392 236 C 402 240, 404 254, 396 264 L 300 272 C 284 274, 272 266, 270 254 C 268 242, 274 234, 286 230 Z" fill="#f1e6d6"/>
  <!-- talus with neck and head toward the toes -->
  <path d="M316 200 C 330 186, 378 184, 392 196 C 400 202, 404 210, 414 212 C 428 212, 440 218, 442 228 C 444 238, 436 244, 426 242 L 404 238 C 392 236, 360 236, 334 232 C 318 228, 308 214, 316 200 Z" fill="#f3e3cb"/>
  <!-- navicular and forefoot hint -->
  <path d="M440 220 C 450 222, 458 230, 458 242 L 456 262 L 404 264 C 408 256, 408 248, 404 240 L 426 244 C 436 246, 444 238, 440 220 Z" fill="#f1e6d6"/>
  <!-- tibia (posterior lip on the left lower than the front) -->
  <path d="M332 24 L388 24 C 388 80, 390 130, 394 160 C 398 176, 398 188, 394 196 C 380 188, 340 186, 318 200 C 314 190, 316 176, 320 164 C 328 140, 332 90, 332 24 Z" fill="#fbf1e1"/>
</g>
<!-- joint cartilage -->
<path d="M320 199 C 340 187, 378 187, 393 195" fill="none" stroke="#5fb3ab" stroke-width="4" stroke-linecap="round"/>
<!-- fibula from the side: lies over the back part of the talus, semi-transparent -->
<path d="M342 24 L358 24 C 358 80, 358 130, 362 168 C 366 186, 368 204, 364 218 C 360 230, 344 232, 338 220 C 332 206, 336 186, 340 168 C 342 130, 342 80, 342 24 Z" fill="#fbf1e1" fill-opacity="0.75" stroke="#8a6a45" stroke-width="2.4" stroke-linejoin="round"/>
<!-- posterior malleolus: back edge of the tibia -->
<path d="M318 200 C 314 190, 316 176, 320 164" fill="none" stroke="#e0661f" stroke-width="6" stroke-linecap="round"/>
<ellipse cx="320" cy="184" rx="16" ry="22" fill="none" stroke="#1f7a70" stroke-width="2.5" stroke-dasharray="5 4"/>

<!-- ===== numbered markers ===== -->
<g font-family="Inter, Arial, sans-serif" font-weight="800" font-size="15" text-anchor="middle" fill="#fff">
  <circle cx="130" cy="84" r="13" fill="#1f7a70"/><text x="130" y="89">1</text>
  <circle cx="69" cy="84" r="13" fill="#1f7a70"/><text x="69" y="89">2</text>
  <circle cx="206" cy="214" r="13" fill="#1f7a70"/><text x="206" y="219">3</text>
  <circle cx="30" cy="240" r="13" fill="#1f7a70"/><text x="30" y="245">4</text>
  <circle cx="125" cy="222" r="13" fill="#1f7a70"/><text x="125" y="227">5</text>
  <circle cx="120" cy="128" r="13" fill="#f0a24f"/><text x="120" y="133">6</text>
  <circle cx="282" cy="168" r="13" fill="#e0661f"/><text x="282" y="173">7</text>
  <circle cx="374" cy="84" r="13" fill="#1f7a70"/><text x="374" y="89">1</text>
  <circle cx="350" cy="126" r="11" fill="#1f7a70"/><text x="350" y="131" font-size="13">2</text>
  <circle cx="420" cy="226" r="11" fill="#1f7a70"/><text x="420" y="231" font-size="13">5</text>
</g>
<!-- leader lines -->
<g stroke="#1f7a70" stroke-width="2" fill="none" stroke-linecap="round">
  <path d="M193 213 L184 210"/><path d="M42 234 L48 228"/>
</g>
<path d="M295 170 L304 174" stroke="#e0661f" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M112 138 L94 152" stroke="#f0a24f" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
