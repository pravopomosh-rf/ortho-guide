name: med-watch
on:
  schedule:
    - cron: "41 3 * * 0"   # воскресенье ~05:41 по Израилю
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency: { group: med-watch, cancel-in-progress: false }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install claude-agent-sdk anyio
      - name: Watcher (Max API credits)
        id: w
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WATCH_BUDGET_USD: "5"
        run: python .github/bot/watch_agent.py
      - name: Report as issue + remember seen sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "med-watch"
          git config user.email "med-watch@users.noreply.github.com"
          { echo "⚠️ ТРЕБУЕТ МЕДПРОВЕРКИ — на сайт ничего не внесено."; echo
            echo "Расход: \$${{ steps.w.outputs.cost }} · страница: ${{ steps.w.outputs.page }}"; echo
            cat .github/bot/report_watch.md 2>/dev/null || echo "(отчёта нет)"; } > /tmp/body.md
          gh issue create --title "med-watch $(date +%d.%m): изменения, проверка страницы, новости" --body-file /tmp/body.md
          git add .github/bot/watch_seen.md
          git diff --cached --quiet || { git commit -m "med-watch: найденные источники $(date +%d.%m)"; git push origin HEAD:main; }
