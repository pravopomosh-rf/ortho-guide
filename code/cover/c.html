<html><head><style>
@font-face{font-family:U;src:url(unbounded-cyrillic-800-normal.woff2)}
@font-face{font-family:I;font-weight:600;src:url(inter-cyrillic-600-normal.woff2)}
@font-face{font-family:I;font-weight:700;src:url(inter-cyrillic-700-normal.woff2)}@font-face{font-family:I;font-weight:700;src:url(inter-latin-700-normal.woff2);unicode-range:U+0000-00FF}@font-face{font-family:I;font-weight:600;src:url(inter-latin-600-normal.woff2);unicode-range:U+0000-00FF}
body{margin:0;width:1080px;height:1920px;background:linear-gradient(170deg,#f4f7f8 0%,#e6f0f1 55%,#d5e8e8 100%);font-family:I;position:relative;overflow:hidden}
.brand{position:absolute;top:110px;left:90px;font:700 30px I;letter-spacing:.14em;color:#0e7c7b}
.tag{position:absolute;top:220px;left:90px;background:#e8572a;color:#fff;font:700 34px I;padding:14px 30px;border-radius:40px}
