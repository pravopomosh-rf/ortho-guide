<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:U;font-weight:800;src:url(fonts/unbounded-cyrillic-800-normal.woff2)}@font-face{font-family:U;font-weight:800;src:url(fonts/unbounded-latin-800-normal.woff2);unicode-range:U+0000-00FF}

@font-face{font-family:I;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2);unicode-range:U+0000-00FF}@font-face{font-family:I;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:H;font-weight:600;src:url(fonts/heebo-hebrew-600-normal.woff2)}@font-face{font-family:H;font-weight:700;src:url(fonts/heebo-hebrew-700-normal.woff2)}@font-face{font-family:H;font-weight:800;src:url(fonts/heebo-hebrew-800-normal.woff2)}
@font-face{font-family:H;font-weight:600;src:url(fonts/heebo-latin-600-normal.woff2);unicode-range:U+0000-00FF}@font-face{font-family:H;font-weight:700;src:url(fonts/heebo-latin-700-normal.woff2);unicode-range:U+0000-00FF}@font-face{font-family:H;font-weight:800;src:url(fonts/heebo-latin-800-normal.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:A;font-weight:600;src:url(fonts/noto-kufi-arabic-arabic-600-normal.woff2)}@font-face{font-family:A;font-weight:700;src:url(fonts/noto-kufi-arabic-arabic-700-normal.woff2)}@font-face{font-family:A;font-weight:800;src:url(fonts/noto-kufi-arabic-arabic-800-normal.woff2)}
@font-face{font-family:A;font-weight:600;src:url(fonts/noto-kufi-arabic-latin-600-normal.woff2);unicode-range:U+0000-00FF}@font-face{font-family:A;font-weight:700;src:url(fonts/noto-kufi-arabic-latin-700-normal.woff2);unicode-range:U+0000-00FF}@font-face{font-family:A;font-weight:800;src:url(fonts/noto-kufi-arabic-latin-800-normal.woff2);unicode-range:U+0000-00FF}
*{box-sizing:border-box}
body{margin:0;width:960px;height:720px;background:linear-gradient(160deg,#f4f7f8 0%,#e3eff0 60%,#d2e7e7 100%);font-family:I;overflow:hidden;position:relative}
body.he{font-family:H}body.ar{font-family:A}
.card{position:absolute;inset:0;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card img{width:100%;height:100%;object-fit:cover}
.card img.fr{object-position:50% 50%;transform:scale(1.2);transform-origin:50% 15%}
.card img.cut{object-position:50% 12%}
.card img.c{object-fit:contain;padding:30px 30px 150px}
.tag{position:absolute;top:62px;inset-inline-start:62px;background:#e8572a;color:#fff;font-weight:700;font-size:34px;padding:12px 28px;border-radius:40px;box-shadow:0 8px 22px rgba(232,87,42,.3);max-width:780px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play{position:absolute;bottom:34px;inset-inline-start:34px;display:flex;align-items:center;gap:24px;background:rgba(255,255,255,.94);padding:16px 44px 16px 16px;border-radius:80px;box-shadow:0 12px 30px rgba(20,60,70,.2)}
[dir=rtl] .play{padding:16px 16px 16px 44px}
.btn{flex:none;width:150px;height:150px;border-radius:50%;background:#0e7c7b;display:flex;align-items:center;justify-content:center}
.btn:after{content:"";border-left:54px solid #fff;border-top:33px solid transparent;border-bottom:33px solid transparent;margin-left:13px}
.dur{font-weight:700;font-size:68px;color:#15202b}
